name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.18.0, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase services
        env:
          POSTGRES_PASSWORD: postgres
        run: |
          # Start Supabase services
          supabase start
          
          # Wait for services to be ready
          sleep 10
          
          # Apply migrations to test database
          supabase db reset

      - name: Set up test environment variables
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=http://localhost:54321" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(supabase status | grep anon | awk '{print $3}')" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status | grep service_role | awk '{print $3}')" >> $GITHUB_ENV
          echo "ENCRYPTION_KEY=$ENCRYPTION_KEY" >> $GITHUB_ENV

      - name: Build the application
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Stop Supabase services
        if: always()
        run: supabase stop